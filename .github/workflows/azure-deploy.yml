name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  AZURE_WEBAPP_NAME: razorpay-api-manya   # Azure App Service name
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (poppler-utils for pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Deploy
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: test
  
    permissions:
      id-token: write
      contents: read
  
    steps:
      - uses: actions/checkout@v4

      # OIDC login — no long-lived secret JSON needed.
      # Requires a federated credential on the service principal
      # configured to trust this repo + branch.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pin startup command and enable Oryx build on every deploy
      # so Azure always runs `pip install -r requirements.txt` server-side.
      - name: Configure App Service startup & build settings
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --startup-file "startup.sh"

          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      # Zip-deploy source; Oryx installs requirements.txt server-side.
      # No Docker, no ACR, no publish-profile.
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Azure Logout
        run: az logout
