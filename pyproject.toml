[project]
name = "razorpay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bropal", email = "gopal.kataria@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
